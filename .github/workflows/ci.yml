name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: dollshop_dev_password
          POSTGRES_DB: dollshop
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Code style linting
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Database migrations & seed (CI Postgres)
        env:
          DATABASE_URL: postgres://app_user:dollshop_dev_password@localhost:5433/dollshop
          DATABASE_OWNER_URL: postgres://app_user:dollshop_dev_password@localhost:5433/dollshop
          BETTER_AUTH_SECRET: ci_test_better_auth_secret_minimum_32_characters_long
          CRON_SECRET: ci_cron_secret
          BETTER_AUTH_URL: http://localhost:3000
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run unit & security test suite
        env:
          DATABASE_URL: postgres://app_user:dollshop_dev_password@localhost:5433/dollshop
          DATABASE_OWNER_URL: postgres://app_user:dollshop_dev_password@localhost:5433/dollshop
          BETTER_AUTH_SECRET: ci_test_better_auth_secret_minimum_32_characters_long
          CRON_SECRET: ci_cron_secret
          BETTER_AUTH_URL: http://localhost:3000
        run: npm test

      - name: Build Next.js standalone application
        env:
          DATABASE_URL: postgres://app_user:dollshop_dev_password@localhost:5433/dollshop
          BETTER_AUTH_SECRET: ci_test_better_auth_secret_minimum_32_characters_long
          CRON_SECRET: ci_cron_secret
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: https://dollshop.by
        run: npm run build
