name: CD Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Docker & Deploy to Belarus VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Деплой выполняется только при наличии настроенных секретов сервера
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push standalone Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS over SSH
        if: env.HAS_SSH_SECRET == 'true'
        env:
          HAS_SSH_SECRET: ${{ secrets.SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'deploy' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Начало обновления DollShop на сервере..."
            cd /opt/dollshop

            # Авторизация в GHCR на сервере
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Загрузка актуального образа
            docker compose -f deploy/docker-compose.prod.yml pull app

            # Применение миграций базы данных
            docker compose -f deploy/docker-compose.prod.yml run --rm app npm run db:migrate

            # Перезапуск контейнера без простоя (Rolling restart)
            docker compose -f deploy/docker-compose.prod.yml up -d --no-deps app
            docker compose -f deploy/docker-compose.prod.yml exec -T nginx nginx -s reload

            # Проверка здоровья
            sleep 5
            HEALTH=$(curl -s http://localhost:3000/api/health | jq -r .status || echo "fail")
            if [ "$HEALTH" != "ok" ]; then
              echo "❌ Ошибка: сервис не прошел проверку здоровья /api/health!"
              exit 1
            fi

            echo "✅ Развертывание успешно завершено! /api/health вернул OK."
