upstream nextjs_upstream {
    server web:3000;
    keepalive 32;
}

# Маппинг для поддержки WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Правила обхода микрокэша
map $request_method $no_cache_method {
    default 1;
    GET     0;
    HEAD    0;
}

map $request_uri $no_cache_uri {
    default 0;
    ~*^/api/                 1;
    ~*^/admin                1;
    ~*^/cart                 1;
    ~*^/korzina              1;
    ~*^/oformlenie           1;
    ~*^/oplata               1;
    ~*^/zakaz                1;
}

map $http_cookie $no_cache_cookie {
    default 0;
    ~*better-auth\.session_token  1;
    ~*doll_res_                   1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Защитные HTTP-заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 1. Долгосрочное кэширование статических хэшированных ассетов Next.js (1 год, immutable)
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Кэширование медиа-файлов, изображений и фавиконок (7 дней)
    location ~* \.(webp|avif|jpg|jpeg|png|gif|svg|ico|woff2|woff)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # 3. Маршрут health-check для UptimeRobot и Docker без логирования и кэширования
    location = /api/health {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 4. Основной прокси-блок с микрокэшем (5 секунд)
    location / {
        # Определяем необходимость обхода кэша
        set $skip_cache 0;
        if ($no_cache_method) {
            set $skip_cache 1;
        }
        if ($no_cache_uri) {
            set $skip_cache 1;
        }
        if ($no_cache_cookie) {
            set $skip_cache 1;
        }

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Настройки микрокэша nginx (5 секунд для публичных страниц каталога)
        proxy_cache microcache;
        proxy_cache_valid 200 301 302 5s;
        proxy_cache_valid 404 1m;
        
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;
        
        # Защита от давки кэша (Cache Stampede) при дропе кукол
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_lock_age 5s;

        # Отладочный заголовок HIT / MISS / BYPASS
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
